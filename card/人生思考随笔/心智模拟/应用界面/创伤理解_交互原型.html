<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创伤理解交互原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #181b1f;
      --panel-strong: #20252b;
      --line: #313740;
      --text: #ece7de;
      --muted: #a8a096;
      --accent: #7cc6b7;
      --accent-soft: #183530;
      --warn: #f2c48a;
      --warn-soft: #3a2a1b;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      --radius: 8px;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111315;
      --panel: #181b1f;
      --panel-strong: #20252b;
      --line: #313740;
      --text: #ece7de;
      --muted: #a8a096;
      --accent: #7cc6b7;
      --accent-soft: #183530;
      --warn: #f2c48a;
      --warn-soft: #3a2a1b;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    body[data-theme="paper"] {
      color-scheme: light;
      --bg: #f4f1eb;
      --panel: #fffdf9;
      --panel-strong: #f8f4ee;
      --line: #d7cec0;
      --text: #1e1c18;
      --muted: #6a6256;
      --accent: #2c6e62;
      --accent-soft: #dceee9;
      --warn: #7b4e17;
      --warn-soft: #f4e7d6;
      --shadow: 0 12px 36px rgba(32, 25, 17, 0.08);
    }

    body[data-theme="dusk"] {
      color-scheme: dark;
      --bg: #17141d;
      --panel: #201c28;
      --panel-strong: #2b2636;
      --line: #433d52;
      --text: #efe8f7;
      --muted: #b6adca;
      --accent: #d1a6ff;
      --accent-soft: #38284c;
      --warn: #ffd59a;
      --warn-soft: #49341f;
      --shadow: 0 16px 40px rgba(8, 5, 15, 0.32);
    }

    body[data-theme="forest"] {
      color-scheme: dark;
      --bg: #0f1613;
      --panel: #17201c;
      --panel-strong: #203029;
      --line: #30443b;
      --text: #e7efe8;
      --muted: #9eb1a3;
      --accent: #8fd4a5;
      --accent-soft: #1e3d2b;
      --warn: #f0cb8f;
      --warn-soft: #40311e;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 24px;
      padding: 24px;
      align-items: start;
    }

    .main,
    .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .main {
      padding: 28px;
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .side {
      padding: 20px;
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(26px, 3vw, 36px);
      line-height: 1.2;
    }

    h2 {
      font-size: 24px;
      line-height: 1.3;
    }

    .subtle {
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-strong);
      padding: 20px;
    }

    .step-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: color-mix(in srgb, var(--line) 76%, transparent);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, white));
      transition: width 180ms ease;
    }

    .content {
      white-space: pre-wrap;
      font-size: 18px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .option-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-detail-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel-strong) 82%, transparent);
      padding: 14px 16px;
    }

    .option-detail-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .option-detail-card p {
      margin-top: 8px;
    }

    .option-detail-card .tiny + .tiny {
      margin-top: 6px;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 14px 16px;
      text-align: left;
      font: inherit;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
      min-height: 58px;
    }

    button:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--panel) 88%, var(--accent-soft));
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .secondary {
      background: var(--panel-strong);
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      font-size: 14px;
    }

    .result {
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--accent-soft) 40%, var(--panel));
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .warn {
      background: var(--warn-soft);
      border-color: color-mix(in srgb, var(--warn) 50%, var(--line));
      color: var(--text);
    }

    .tiny {
      font-size: 13px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topnav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }

    .select-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 220px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    select {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }

    .toolbar button {
      min-height: auto;
      padding: 10px 14px;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-buttons button {
      min-height: auto;
      padding: 10px 14px;
    }

    .view-switches {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .view-switches button {
      min-height: auto;
      padding: 10px 14px;
    }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95em;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 8px 0;
    }

    @media (max-width: 960px) {
      .app {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <main class="main">
      <div>
        <div class="eyebrow">Interactive Prototype</div>
        <h1>创伤理解交互原型</h1>
      </div>

      <div class="card">
        <div class="step-row">
          <div>
            <div id="phaseBadge" class="badge">载入中</div>
          </div>
          <div class="subtle" id="stepMeta">正在读取交互数据</div>
        </div>
        <div class="progress" aria-hidden="true">
          <span id="progressBar"></span>
        </div>
      </div>

      <div class="card topnav">
        <div class="select-wrap">
          <label for="cardSelect">卡片目录</label>
          <select id="cardSelect" aria-label="跳转卡片">
            <option value="">选择卡片</option>
          </select>
        </div>
        <div class="nav-buttons">
          <button id="prevBtn" class="secondary" type="button">上一步</button>
          <button id="nextBtn" class="secondary" type="button">下一步</button>
          <button id="exportBtn" class="secondary" type="button">导出结果</button>
        </div>
      </div>

      <section id="contentArea" class="card" aria-live="polite"></section>

      <div id="actionArea" class="button-grid"></div>

      <div class="toolbar">
        <div class="select-wrap">
          <label for="themeSelect">主题</label>
          <select id="themeSelect" aria-label="选择主题">
            <option value="dark">深色</option>
            <option value="paper">纸页</option>
            <option value="dusk">薄暮</option>
            <option value="forest">林地</option>
          </select>
        </div>
        <button id="restartBtn" class="secondary" type="button">重新开始</button>
      </div>
    </main>

    <aside class="side">
      <div>
        <h2>当前状态</h2>
        <p class="subtle">这里显示累计倾向和分类结果，不需要对外展示时也可以隐藏。</p>
      </div>

      <div class="card">
        <div id="stateSummary" class="tiny"></div>
      </div>

      <div>
        <h3>操作历史</h3>
      </div>
      <div id="historyList" class="history"></div>
    </aside>
  </div>

  <script src="./创伤理解_交互原型.js"></script>
</body>
</html>
