cognitive_cards:
- id: root/1
  title: 机器学习
  type: folder
  tag: 层级分类
  description: 人工智能的子领域，使计算机能够从数据中学习和改进。
  corpus:
  - 机器学习是人工智能的一个子领域，使计算机能够从数据中学习和改进。
  - 主要范式包括监督学习、无监督学习和强化学习。
  bound_nodes:
  - node-ml-foundation
  - node-ai-intro
- id: root/1/1
  title: 监督学习
  type: leaf
  tag: 决策分支
  description: 使用标注数据训练模型，学习输入到输出的映射函数。
  corpus:
  - 使用标注数据训练模型，学习从输入到输出的映射函数。
  - 常见算法包括线性回归、逻辑回归、SVM、决策树和神经网络。
  bound_nodes:
  - node-supervised
  - node-ml-foundation
- id: root/1/2
  title: 无监督学习
  type: leaf
  tag: 层级分类
  description: 从未标注数据中发现隐藏的模式和结构。
  corpus:
  - 从未标注数据中发现隐藏的模式和结构。
  - 常见算法包括聚类（K-means）、降维（PCA）和关联规则学习。
  bound_nodes:
  - node-unsupervised
- id: root/1/3
  title: 强化学习
  type: leaf
  tag: 决策分支
  description: 智能体通过与环境交互、基于奖励信号学习最优策略。
  corpus:
  - 强化学习关注智能体如何在环境中采取行动以最大化累积奖励。
  - 核心概念包括状态、动作、奖励、策略与价值函数，代表算法有 Q-Learning 与策略梯度。
  bound_nodes:
  - node-reinforcement
- id: root/2
  title: 神经网络
  type: folder
  tag: 层级分类
  description: 受生物神经网络启发设计的计算模型。
  corpus:
  - 受生物神经网络启发设计的计算模型，由大量相互连接的神经元层构成。
  - 通过反向传播算法调整权重，拟合复杂的非线性映射。
  bound_nodes:
  - node-nn-foundation
- id: root/2/1
  title: CNN 卷积神经网络
  type: leaf
  tag: 决策分支
