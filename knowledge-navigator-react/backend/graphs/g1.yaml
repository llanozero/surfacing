  corpus:
  - 注意力机制通过查询、键、值计算相关性权重，实现对输入的软选择。
  - 自注意力是 Transformer 的核心构件。
  bound_nodes:
  - node-attention
  - node-nlp
- id: root/3
  title: 深度学习
  type: folder
  tag: 层级分类
  description: 基于多层神经网络的机器学习方法。
  corpus:
  - 深度学习使用多层神经网络逐层抽象数据特征。
  - 训练依赖大规模数据、GPU 算力与反向传播算法。
  bound_nodes:
  - node-deep-learning
- id: root/3/1
  title: 反向传播
  type: leaf
  tag: 层级分类
  description: 通过链式法则高效计算梯度并更新网络权重。
  corpus:
