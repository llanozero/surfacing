    corpus:
      - 使用标注数据训练模型，学习从输入到输出的映射函数。
      - 常见算法包括线性回归、逻辑回归、SVM、决策树和神经网络。
    bound_nodes:
      - node-supervised
      - node-ml-foundation
  - id: root/1/2
    title: 无监督学习
    type: leaf
    tag: 层级分类
