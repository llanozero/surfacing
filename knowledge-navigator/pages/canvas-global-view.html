<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>画布全览 - 认知导航</title>
    <style id="theme-vars">
/* ===== 认知导航 Canvas — Dark Tech Theme ===== */

:root {
  /* Slate palette */
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --slate-950: #020617;

  /* Cyan accent palette */
  --cyan-50: #ecfeff;
  --cyan-100: #cffafe;
  --cyan-200: #a5f3fc;
  --cyan-300: #67e8f9;
  --cyan-400: #22d3ee;
  --cyan-500: #06b6d4;
  --cyan-600: #0891b2;
  --cyan-700: #0e7490;
  --cyan-800: #155e75;
  --cyan-900: #164e63;
  --cyan-950: #083344;

  /* Teal accent palette */
  --teal-50: #f0fdfa;
  --teal-100: #ccfbf1;
  --teal-200: #99f6e4;
  --teal-300: #5eead4;
  --teal-400: #2dd4bf;
  --teal-500: #14b8a6;
  --teal-600: #0d9488;
  --teal-700: #0f766e;
  --teal-800: #115e59;
  --teal-900: #134e4a;
  --teal-950: #042f2e;

  /* Typography */
  --font-sans: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Dark theme semantic aliases */
  --background: #0f172a;
  --foreground: #e2e8f0;
  --card: #1e293b;
  --card-foreground: #e2e8f0;
  --popover: #1e293b;
  --popover-foreground: #e2e8f0;
  --primary: #06b6d4;
  --primary-foreground: #ffffff;
  --primary-hover: #0891b2;
  --muted: #334155;
  --muted-foreground: #94a3b8;
  --border: #334155;
  --input: #1e293b;
  --ring: #06b6d4;

  /* Graph specific */
  --node-card-bg: #1e293b;
  --node-card-stroke: #06b6d4;
  --node-path-fill: #14b8a6;
  --node-path-stroke: #2dd4bf;
  --edge-default: rgba(6, 182, 212, 0.35);
  --edge-heavy: rgba(6, 182, 212, 0.65);
  --edge-light: rgba(20, 184, 166, 0.25);
}

body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  margin: 0;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
  }
  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { word-break: break-all; word-break: auto-phrase; }
    th { white-space: nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--background); }
      .text-background { color: var(--background); }
      .border-background { border-color: var(--background); }
      .ring-background { --tw-ring-color: var(--background); }
      .bg-foreground { background-color: var(--foreground); }
      .text-foreground { color: var(--foreground); }
      .border-foreground { border-color: var(--foreground); }
      .ring-foreground { --tw-ring-color: var(--foreground); }
      .bg-card { background-color: var(--card); }
      .text-card { color: var(--card); }
      .border-card { border-color: var(--card); }
      .ring-card { --tw-ring-color: var(--card); }
      .bg-card-foreground { background-color: var(--card-foreground); }
      .text-card-foreground { color: var(--card-foreground); }
      .border-card-foreground { border-color: var(--card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--card-foreground); }
      .bg-popover { background-color: var(--popover); }
      .text-popover { color: var(--popover); }
      .border-popover { border-color: var(--popover); }
      .ring-popover { --tw-ring-color: var(--popover); }
      .bg-popover-foreground { background-color: var(--popover-foreground); }
      .text-popover-foreground { color: var(--popover-foreground); }
      .border-popover-foreground { border-color: var(--popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--popover-foreground); }
      .bg-primary { background-color: var(--primary); }
      .text-primary { color: var(--primary); }
      .border-primary { border-color: var(--primary); }
      .ring-primary { --tw-ring-color: var(--primary); }
      .bg-primary-foreground { background-color: var(--primary-foreground); }
      .text-primary-foreground { color: var(--primary-foreground); }
      .border-primary-foreground { border-color: var(--primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--primary-foreground); }
      .bg-muted { background-color: var(--muted); }
      .text-muted { color: var(--muted); }
      .border-muted { border-color: var(--muted); }
      .ring-muted { --tw-ring-color: var(--muted); }
      .bg-muted-foreground { background-color: var(--muted-foreground); }
      .text-muted-foreground { color: var(--muted-foreground); }
      .border-muted-foreground { border-color: var(--muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--muted-foreground); }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }
      .bg-input { background-color: var(--input); }
      .text-input { color: var(--input); }
      .border-input { border-color: var(--input); }
      .ring-input { --tw-ring-color: var(--input); }
      .bg-ring { background-color: var(--ring); }
      .text-ring { color: var(--ring); }
      .border-ring { border-color: var(--ring); }
      .ring-ring { --tw-ring-color: var(--ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-[#0f172a] text-[#e2e8f0]">
    <main class="flex flex-col min-h-screen" id="page-canvas-global-view" data-page-id="page-canvas-global-view">

        <!-- ===== Simulated Mobile Status Bar ===== -->
        <div class="sticky top-0 z-40 flex items-center justify-between h-7 px-5 bg-[#0f172a] text-[11px] leading-none text-[#e2e8f0]">
            <span class="tabular-nums font-medium">9:41</span>
            <div class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#e2e8f0"/>
                    <rect x="4.5" y="3.5" width="2" height="9" rx="0.5" fill="#e2e8f0"/>
                    <rect x="8" y="2" width="2" height="11" rx="0.5" fill="#e2e8f0"/>
                    <rect x="11.5" y="1" width="2" height="13" rx="0.5" fill="#e2e8f0"/>
                </svg>
                <svg class="w-5 h-3" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0.5" y="0.5" width="20" height="12" rx="2.5" stroke="#e2e8f0" stroke-width="1"/>
                    <rect x="2" y="2" width="15" height="9" rx="1" fill="#e2e8f0"/>
                    <rect x="19" y="3" width="1.5" height="3" rx="0.75" fill="#e2e8f0"/>
                </svg>
            </div>
        </div>

        <!-- ===== Header ===== -->
        <div class="px-4 pt-5 pb-2 flex items-center justify-between">
            <div>
                <h1 class="text-[26px] font-bold leading-tight text-[#06b6d4]" style="text-wrap: balance; word-break: keep-all;">认知导航<span class="text-[#e2e8f0] text-[18px] ml-1.5 font-normal">&middot; 画布</span></h1>
                <p class="text-[13px] leading-relaxed text-[#94a3b8] mt-0.5">Knowledge Graph</p>
            </div>
            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-semibold tracking-wider bg-[#06b6d4]/15 text-[#06b6d4] border border-[#06b6d4]/30">CANVAS</span>
        </div>

        <!-- ===== Search Bar ===== -->
        <div class="px-4 pb-3">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i data-lucide="search" class="w-[18px] h-[18px] text-[#94a3b8]"></i>
                </div>
                <input
                    type="text"
                    placeholder="搜索认知卡片..."
                    class="w-full h-11 pl-10 pr-4 bg-[#1e293b] border border-[#334155] rounded-lg text-[15px] text-[#e2e8f0] placeholder-[#64748b] focus:outline-none focus:border-[#06b6d4] focus:ring-2 focus:ring-[#06b6d4]/30 transition-all duration-200"
                />
            </div>
        </div>

        <!-- ===== D3 SVG Canvas ===== -->
        <div data-dom-id="canvas-node-nav" class="flex-1 relative mx-2 mb-1 rounded-xl overflow-hidden border border-[#334155] bg-[#0f172a]" style="min-height:420px">
            <!-- Background grid -->
            <svg id="d3-canvas" class="w-full h-full" style="display:block"></svg>
            <div class="absolute top-3 right-3 flex gap-1.5">
                <button id="btn-zoom-in" class="w-8 h-8 flex items-center justify-center rounded-md bg-[#1e293b] border border-[#334155] text-[#94a3b8] hover:text-[#06b6d4] hover:border-[#06b6d4]/40 transition-colors" title="放大">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
                <button id="btn-zoom-out" class="w-8 h-8 flex items-center justify-center rounded-md bg-[#1e293b] border border-[#334155] text-[#94a3b8] hover:text-[#06b6d4] hover:border-[#06b6d4]/40 transition-colors" title="缩小">
                    <i data-lucide="zoom-out" class="w-4 h-4"></i>
                </button>
                <button id="btn-zoom-reset" class="w-8 h-8 flex items-center justify-center rounded-md bg-[#1e293b] border border-[#334155] text-[#94a3b8] hover:text-[#06b6d4] hover:border-[#06b6d4]/40 transition-colors" title="重置">
                    <i data-lucide="maximize" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- ===== Bottom Legend Bar ===== -->
        <div class="px-4 py-2.5 flex items-center justify-center gap-4 text-[11px] text-[#94a3b8] border-t border-[#334155] flex-wrap">
            <span class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-sm border border-[#06b6d4] bg-[#1e293b]"></span>
                认知卡片
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[#14b8a6]"></span>
                路径节点
            </span>
            <span class="flex items-center gap-1.5">
                <svg width="24" height="6" class="shrink-0"><line x1="0" y1="3" x2="24" y2="3" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.55"/></svg>
                预设权重
            </span>
            <span class="flex items-center gap-1.5">
                <svg width="24" height="6" class="shrink-0"><line x1="0" y1="3" x2="24" y2="3" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 3"/></svg>
                浏览权重
            </span>
        </div>

        <!-- ===== Bottom Navigation Bar ===== -->
        <nav data-mobile-nav="canvas" class="sticky bottom-0 left-0 right-0 z-50 bg-[#1e293b] border-t border-[#334155]" style="height:56px">
            <div class="w-full max-w-md mx-auto grid grid-cols-4 h-full">
                <!-- 全览 — active -->
                <button
                    data-nav-key="global-view"
                    data-dom-id="tab-nav-global-view"
                    data-active="true"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#06b6d4] transition-colors duration-150"
                >
                    <i data-lucide="globe" class="w-5 h-5 shrink-0"></i>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">全览</span>
                </button>
                <!-- 导航 -->
                <button
                    data-nav-key="path-select"
                    data-dom-id="tab-nav-path-select"
                    data-active="false"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#94a3b8] transition-colors duration-150"
                >
                    <i data-lucide="git-branch" class="w-5 h-5 shrink-0"></i>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">导航</span>
                </button>
                <!-- 浏览 -->
                <button
                    data-nav-key="content-browse"
                    data-dom-id="tab-nav-content-browse"
                    data-active="false"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#94a3b8] transition-colors duration-150"
                >
                    <i data-lucide="play" class="w-5 h-5 shrink-0"></i>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">浏览</span>
                </button>
                <!-- 管理 -->
                <button
                    data-nav-key="tree-manager"
                    data-dom-id="tab-nav-tree-manager"
                    data-active="false"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#94a3b8] transition-colors duration-150"
                >
                    <i data-lucide="folder-tree" class="w-5 h-5 shrink-0"></i>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">管理</span>
                </button>
            </div>
        </nav>
    </main>

    <script>
    lucide.createIcons();

    (function() {
      const svgEl = document.getElementById('d3-canvas');
      if (!svgEl) return;

      const container = svgEl.parentElement;
      const width = container.clientWidth;
      const height = container.clientHeight;

      // ===== SVG Setup =====
      const svg = d3.select('#d3-canvas')
        .attr('width', width)
        .attr('height', height)
        .style('background', '#0f172a');

      // Background dot grid
      const defs = svg.append('defs');
      const gridPattern = defs.append('pattern')
        .attr('id', 'dot-grid')
        .attr('width', 30)
        .attr('height', 30)
        .attr('patternUnits', 'userSpaceOnUse');
      gridPattern.append('circle')
        .attr('cx', 15)
        .attr('cy', 15)
        .attr('r', 1)
        .attr('fill', '#334155')
        .attr('opacity', 0.5);

      svg.append('rect')
        .attr('width', '100%')
        .attr('height', '100%')
        .attr('fill', 'url(#dot-grid)');

      // Arrow marker for edges
      defs.append('marker')
        .attr('id', 'arrowhead')
        .attr('viewBox', '0 -4 8 8')
        .attr('refX', 18)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-4 L8,0 L0,4')
        .attr('fill', '#06b6d4')
        .attr('opacity', 0.5);

      defs.append('marker')
        .attr('id', 'arrowhead-light')
        .attr('viewBox', '0 -4 8 8')
        .attr('refX', 18)
        .attr('refY', 0)
        .attr('markerWidth', 5)
        .attr('markerHeight', 5)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-4 L8,0 L0,4')
        .attr('fill', '#14b8a6')
        .attr('opacity', 0.35);

      // Glow filter for pulse effect
      const filter = defs.append('filter')
        .attr('id', 'glow')
        .attr('x', '-50%').attr('y', '-50%')
        .attr('width', '200%').attr('height', '200%');
      filter.append('feGaussianBlur')
        .attr('stdDeviation', '3')
        .attr('result', 'coloredBlur');
      filter.append('feMerge')
        .selectAll('feMergeNode')
        .data(['coloredBlur', 'SourceGraphic'])
        .enter().append('feMergeNode')
        .attr('in', function(d) { return d; });

      // ===== Graph Data =====
      const graphData = {
        nodes: [
          // Cognitive cards (type: 'card')
          { id: 'ml', label: '机器学习', type: 'card', desc: '从数据中学习', width: 110, height: 46 },
          { id: 'dl', label: '深度学习', type: 'card', desc: '多层表示学习', width: 100, height: 46 },
          { id: 'nn', label: '神经网络', type: 'card', desc: '计算模型', width: 100, height: 46 },
          { id: 'nlp', label: '自然语言处理', type: 'card', desc: '理解人类语言', width: 120, height: 46 },
          { id: 'cv', label: '计算机视觉', type: 'card', desc: '图像理解', width: 110, height: 46 },
          { id: 'kg', label: '知识图谱', type: 'card', desc: '语义网络', width: 100, height: 46 },
          { id: 'rl', label: '强化学习', type: 'card', desc: '试错决策', width: 100, height: 46 },
          // Path nodes (type: 'path')
          { id: 'path-ai', label: 'AI 入门', type: 'path', radius: 22 },
          { id: 'path-adv', label: '进阶 DL', type: 'path', radius: 22 },
          { id: 'path-nlp', label: 'NLP 专项', type: 'path', radius: 22 },
          { id: 'path-cv', label: 'CV 专项', type: 'path', radius: 22 },
        ],
        edges: [
          { source: 'ml', target: 'path-ai', weight: 8 },
          { source: 'nn', target: 'path-ai', weight: 6 },
          { source: 'dl', target: 'path-ai', weight: 5 },
          { source: 'dl', target: 'path-adv', weight: 9 },
          { source: 'nn', target: 'path-adv', weight: 7 },
          { source: 'ml', target: 'path-adv', weight: 4 },
          { source: 'nlp', target: 'path-nlp', weight: 10 },
          { source: 'ml', target: 'path-nlp', weight: 5 },
          { source: 'dl', target: 'path-nlp', weight: 6 },
          { source: 'nn', target: 'path-nlp', weight: 3 },
          { source: 'cv', target: 'path-cv', weight: 9 },
          { source: 'dl', target: 'path-cv', weight: 7 },
          { source: 'nn', target: 'path-cv', weight: 4 },
          { source: 'kg', target: 'path-ai', weight: 4 },
          { source: 'kg', target: 'path-adv', weight: 3 },
          { source: 'rl', target: 'path-adv', weight: 5 },
          { source: 'rl', target: 'path-ai', weight: 3 },
          { source: 'nlp', target: 'path-adv', weight: 4 },
          { source: 'cv', target: 'path-adv', weight: 4 },
          { source: 'kg', target: 'path-nlp', weight: 3 },
        ]
      };

      // Convert string source/target to object references
      const nodeMap = new Map(graphData.nodes.map(n => [n.id, n]));
      graphData.edges.forEach(e => {
        e.source = typeof e.source === 'string' ? nodeMap.get(e.source) : e.source;
        e.target = typeof e.target === 'string' ? nodeMap.get(e.target) : e.target;
      });

      // ===== Container group for zoom =====
      const g = svg.append('g');

      // ===== Draw Edges =====
      const linkGroup = g.append('g').attr('class', 'links');

      const links = linkGroup.selectAll('g')
        .data(graphData.edges)
        .enter().append('g');

      links.append('path')
        .attr('class', 'edge')
        .attr('fill', 'none')
        .attr('stroke', function(d) {
          return d.weight >= 7 ? '#06b6d4' : '#14b8a6';
        })
        .attr('stroke-opacity', function(d) {
          if (d.weight >= 8) return 0.55;
          if (d.weight >= 5) return 0.35;
          return 0.2;
        })
        .attr('stroke-width', function(d) {
          return Math.max(0.8, d.weight * 0.35);
        })
        .attr('stroke-dasharray', function(d) {
          return d.weight <= 4 ? '4 3' : null;
        })
        .attr('marker-end', function(d) {
          return d.weight >= 6 ? 'url(#arrowhead)' : 'url(#arrowhead-light)';
        });

      // ===== Draw Nodes =====
      const nodeGroup = g.append('g').attr('class', 'nodes');

      const nodeSelection = nodeGroup.selectAll('g')
        .data(graphData.nodes)
        .enter().append('g')
        .attr('class', 'node')
        .attr('data-dom-id', function(d) { return d.type === 'path' ? 'canvas-node-nav' : null; })
        .style('cursor', function(d) { return d.type === 'path' ? 'pointer' : 'grab'; });

      // Cognitive cards: rounded rects
      nodeSelection.filter(function(d) { return d.type === 'card'; })
        .append('rect')
        .attr('class', 'card-rect')
        .attr('width', function(d) { return d.width; })
        .attr('height', function(d) { return d.height; })
        .attr('x', function(d) { return -d.width / 2; })
        .attr('y', function(d) { return -d.height / 2; })
        .attr('rx', 8)
        .attr('ry', 8)
        .attr('fill', '#1e293b')
        .attr('stroke', '#06b6d4')
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 0.7);

      // Card labels
      nodeSelection.filter(function(d) { return d.type === 'card'; })
        .append('text')
        .attr('class', 'card-label')
        .attr('text-anchor', 'middle')
        .attr('dy', '-0.15em')
        .attr('fill', '#e2e8f0')
        .attr('font-size', '12px')
        .attr('font-weight', '600')
        .attr('font-family', 'var(--font-sans)')
        .text(function(d) { return d.label; });

      // Card desc (small)
      nodeSelection.filter(function(d) { return d.type === 'card'; })
        .append('text')
        .attr('class', 'card-desc')
        .attr('text-anchor', 'middle')
        .attr('dy', '1.1em')
        .attr('fill', '#64748b')
        .attr('font-size', '9px')
        .attr('font-family', 'var(--font-sans)')
        .text(function(d) { return d.desc; });

      // Path nodes: circles
      nodeSelection.filter(function(d) { return d.type === 'path'; })
        .append('circle')
        .attr('class', 'path-circle')
        .attr('r', function(d) { return d.radius; })
        .attr('fill', '#1e293b')
        .attr('stroke', '#14b8a6')
        .attr('stroke-width', 2.5)
        .style('transition', 'all 0.3s ease');

      // Path node inner ring
      nodeSelection.filter(function(d) { return d.type === 'path'; })
        .append('circle')
        .attr('class', 'path-inner')
        .attr('r', function(d) { return d.radius - 6; })
        .attr('fill', '#14b8a6')
        .attr('opacity', 0.3)
        .style('transition', 'all 0.3s ease');

      // Path labels (outside the circle)
      nodeSelection.filter(function(d) { return d.type === 'path'; })
        .append('text')
        .attr('class', 'path-label')
        .attr('text-anchor', 'middle')
        .attr('dy', function(d) { return d.radius + 14; })
        .attr('fill', '#94a3b8')
        .attr('font-size', '10px')
        .attr('font-weight', '500')
        .attr('font-family', 'var(--font-sans)')
        .text(function(d) { return d.label; });

      // ===== Force Simulation =====
      const simulation = d3.forceSimulation(graphData.nodes)
        .force('link', d3.forceLink(graphData.edges)
          .id(function(d) { return d.id; })
          .distance(function(d) { return d.weight >= 7 ? 140 : 200; })
          .strength(function(d) { return d.weight * 0.06; })
        )
        .force('charge', d3.forceManyBody().strength(-350))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide().radius(function(d) {
          return d.type === 'card' ? Math.max(d.width, d.height) / 1.5 : d.radius + 20;
        }))
        .force('x', d3.forceX(width / 2).strength(0.03))
        .force('y', d3.forceY(height / 2).strength(0.03));

      // ===== Tick =====
      simulation.on('tick', function() {
        links.selectAll('.edge')
          .attr('d', function(d) {
            if (!d.source.x || !d.target.x) return null;
            const dx = d.target.x - d.source.x;
            const dy = d.target.y - d.source.y;
            const dr = Math.sqrt(dx * dx + dy * dy) * 1.2;
            return 'M' + d.source.x + ',' + d.source.y +
              'A' + dr + ',' + dr + ' 0 0,1 ' + d.target.x + ',' + d.target.y;
          });

        nodeSelection.attr('transform', function(d) {
          return 'translate(' + d.x + ',' + d.y + ')';
        });
      });

      // Run warm-up ticks
      for (var i = 0; i < 300; i++) {
        simulation.tick();
      }
      simulation.alpha(0.3).alphaDecay(0.02);

      // ===== Zoom =====
      const zoomBehavior = d3.zoom()
        .scaleExtent([0.4, 3])
        .on('zoom', function(event) {
          g.attr('transform', event.transform);
        });

      svg.call(zoomBehavior);

      // Zoom button handlers
      document.getElementById('btn-zoom-in').addEventListener('click', function() {
        svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.3);
      });
      document.getElementById('btn-zoom-out').addEventListener('click', function() {
        svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.75);
      });
      document.getElementById('btn-zoom-reset').addEventListener('click', function() {
        svg.transition().duration(500).call(
          zoomBehavior.transform,
          d3.zoomIdentity.translate(0, 0).scale(1)
        );
      });

      // ===== Drag =====
      const dragBehavior = d3.drag()
        .on('start', function(event, d) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on('drag', function(event, d) {
          d.fx = event.x;
          d.fy = event.y;
        })
        .on('end', function(event, d) {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        });

      nodeSelection.call(dragBehavior);

      // ===== Click on path nodes =====
      nodeSelection.filter(function(d) { return d.type === 'path'; })
        .on('click', function(event, d) {
          event.stopPropagation();

          // Visual pulse effect
          const circle = d3.select(this).select('.path-circle');
          const inner = d3.select(this).select('.path-inner');

          circle
            .transition().duration(150)
            .attr('r', d.radius + 8)
            .attr('stroke', '#67e8f9')
            .attr('stroke-width', 4)
            .transition().duration(500)
            .attr('r', d.radius)
            .attr('stroke', '#14b8a6')
            .attr('stroke-width', 2.5);

          inner
            .transition().duration(150)
            .attr('r', d.radius - 2)
            .attr('opacity', 0.7)
            .transition().duration(500)
            .attr('r', d.radius - 6)
            .attr('opacity', 0.3);

          // Pulse ring
          const pulseRing = nodeGroup.append('circle')
            .attr('cx', d.x)
            .attr('cy', d.y)
            .attr('r', d.radius)
            .attr('fill', 'none')
            .attr('stroke', '#06b6d4')
            .attr('stroke-width', 2)
            .attr('opacity', 0.8)
            .transition().duration(800)
            .attr('r', d.radius + 30)
            .attr('opacity', 0)
            .remove();
        });

      // ===== Touch double-tap for click fallback on mobile =====
      nodeSelection.filter(function(d) { return d.type === 'path'; })
        .on('touchend', function(event, d) {
          if (event.targetTouches && event.targetTouches.length === 0) {
            // Single tap on mobile — handled by click above
          }
        });

      // ===== Bottom nav tab interactions =====
      document.querySelectorAll('[data-dom-id^="tab-nav-"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var navKey = this.getAttribute('data-nav-key');
          // Dispatch custom event for host page navigation
          var event = new CustomEvent('canvas-tab-navigate', {
            detail: { navKey: navKey },
            bubbles: true
          });
          this.dispatchEvent(event);
        });
      });

      // ===== Resize handler =====
      function handleResize() {
        var w = container.clientWidth;
        var h = container.clientHeight;
        svg.attr('width', w).attr('height', h);
        simulation.force('center', d3.forceCenter(w / 2, h / 2));
        simulation.alpha(0.1).restart();
      }

      // Debounced resize
      var resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleResize, 200);
      });

      // ===== Expose D3 instance for debugging =====
      window.__d3Canvas = {
        svg: svg,
        simulation: simulation,
        zoom: zoomBehavior,
        nodes: graphData.nodes,
        edges: graphData.edges
      };

    })();
    </script>

    <script>lucide.createIcons();</script>
</body>
</html>
