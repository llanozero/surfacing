    <style id="critical-layout">
/* ===== 认知导航 — 深色科技主题 (Canvas Path Select) ===== */
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bd: #334155;
  --pr: #06b6d4;
  --pr-glow: rgba(6,182,212,0.4);
  --pr-dim: rgba(6,182,212,0.12);
  --tx: #e2e8f0;
  --mu: #94a3b8;
  --fn-sans: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --fn-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--fn-sans);
  background: var(--bg);
  color: var(--tx);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
.status-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: 28px; padding: 0 16px; background: var(--bg);
  font-size: 11px; flex-shrink: 0;
}
.status-bar .time { font-variant-numeric: tabular-nums; font-weight: 500; }
.page-header { padding: 12px 16px 8px; flex-shrink: 0; }
.page-header h1 { font-size: 22px; font-weight: 700; color: var(--pr); letter-spacing: -0.01em; line-height: 1.2; }
.page-header .subtitle { font-size: 13px; color: var(--mu); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.page-header .subtitle .path-arrow { color: var(--pr); font-weight: 600; }
.dag-container { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.dag-container svg { width: 100%; height: 100%; display: block; }
.pull-hint {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 6px;
  background: linear-gradient(to top, var(--bg) 40%, transparent);
  pointer-events: none; z-index: 5;
}
.pull-hint .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--bd); margin-bottom: 6px; }
.pull-hint span { font-size: 11px; color: var(--mu); display: flex; align-items: center; gap: 2px; }
.action-bar {
  display: flex; gap: 10px; padding: 10px 16px; flex-shrink: 0;
  border-top: 1px solid var(--bd); background: var(--bg);
}
.btn-primary {
  flex: 1; padding: 10px 16px; border-radius: var(--r-sm);
  background: var(--pr); color: #0f172a; font-size: 15px;
  font-weight: 600; border: none; cursor: pointer;
  transition: opacity 0.15s; text-align: center; font-family: var(--fn-sans);
}
.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { opacity: 0.75; }
.btn-outline {
  flex: 1; padding: 10px 16px; border-radius: var(--r-sm);
  background: transparent; color: var(--pr); font-size: 15px;
  font-weight: 600; border: 1px solid var(--bd); cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  text-align: center; font-family: var(--fn-sans);
}
.btn-outline:hover { background: var(--pr-dim); border-color: var(--pr); }
@keyframes pulse-glow { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
.dag-node-label { font-size: 11px; fill: var(--tx); text-anchor: middle; pointer-events: none; font-family: var(--fn-sans); }
.dag-node-weight { font-size: 10px; fill: var(--mu); text-anchor: middle; pointer-events: none; font-family: var(--fn-mono); }
.dag-current-label { font-size: 13px; fill: var(--tx); text-anchor: middle; pointer-events: none; font-weight: 700; font-family: var(--fn-sans); }
.dag-prev-label { font-size: 11px; fill: var(--mu); text-anchor: middle; pointer-events: none; font-family: var(--fn-sans); }
.edge-preset { stroke-dasharray: none; }
.edge-browse { stroke-dasharray: 5 4; opacity: 0.55; }
    </style>
</head>

<script>
(function() {
  "use strict";

  var graphData = {
    currentNode: { id: "ml-basics", label: "机器学习基础", type: "current", desc: "涵盖监督学习、无监督学习与强化学习" },
    prevNodes: [
      { id: "probability", label: "概率论", type: "prev", presetWeight: 0.75, browseWeight: 0 },
      { id: "linear-algebra", label: "线性代数", type: "prev", presetWeight: 0.82, browseWeight: 0 }
    ],
    nextNodes: [
      { id: "supervised", label: "监督学习", type: "next", presetWeight: 0.80, browseWeight: 0.55 },
      { id: "unsupervised", label: "无监督学习", type: "next", presetWeight: 0.60, browseWeight: 0.42 },
      { id: "reinforcement", label: "强化学习", type: "next", presetWeight: 0.40, browseWeight: 0.30 }
    ]
  };

  var CYAN = "#06b6d4";
  var CYAN_DIM = "rgba(6,182,212,0.25)";
  var CYAN_GLOW = "rgba(6,182,212,0.6)";
  var TXT = "#e2e8f0";
  var MUT = "#94a3b8";
  var CARD = "#1e293b";
  var BORD = "#334155";
  var NODE_R = 28;
  var CURRENT_NODE_R = 36;
  var LAYER_PAD = 90;

  var container = document.getElementById("dag-container");
  var svgEl = document.getElementById("dag-svg");
  var svg = d3.select(svgEl);
  var defs = svg.append("defs");

  var glowFilter = defs.append("filter")
    .attr("id", "cyan-glow").attr("x", "-50%").attr("y", "-50%")
    .attr("width", "200%").attr("height", "200%");
  glowFilter.append("feGaussianBlur").attr("stdDeviation", "6").attr("result", "blur");
  glowFilter.append("feMerge").selectAll("feMergeNode")
    .data(["blur", "SourceGraphic"]).enter().append("feMergeNode")
    .attr("in", function(d) { return d; });

  defs.append("marker").attr("id", "arrow-cyan")
    .attr("viewBox", "0 0 10 10").attr("refX", 10).attr("refY", 5)
    .attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto-start-reverse")
    .append("path").attr("d", "M 0 0 L 10 5 L 0 10 z").attr("fill", CYAN);

  defs.append("marker").attr("id", "arrow-cyan-dim")
    .attr("viewBox", "0 0 10 10").attr("refX", 10).attr("refY", 5)
    .attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto-start-reverse")
    .append("path").attr("d", "M 0 0 L 10 5 L 0 10 z").attr("fill", CYAN_DIM);

  var g = svg.append("g").attr("class", "dag-group");

  function layoutDims() {
    var W = container.clientWidth;
    var H = container.clientHeight;
    svg.attr("viewBox", "0 0 " + W + " " + H);
    return { W: W, H: H, cx: W / 2 };
  }

  function getPositions(dims) {
    var cx = dims.cx, H = dims.H;
    var centerY = H * 0.48;
    var topY = centerY - LAYER_PAD;
    var bottomY = centerY + LAYER_PAD;

    var nextSpacing = dims.W / 4;
    var nextNodes = graphData.nextNodes.map(function(n, i) {
      return { node: n, x: nextSpacing * (i + 1), y: topY };
    });
    var current = { node: graphData.currentNode, x: cx, y: centerY };
    var prevSpacing = dims.W / 3;
    var prevNodes = graphData.prevNodes.map(function(n, i) {
      return { node: n, x: prevSpacing * (i + 1), y: bottomY };
    });
    return { nextNodes: nextNodes, current: current, prevNodes: prevNodes };
  }

  function edgePath(d) {
    var sx = d.source.x, sy = d.source.y;
    var tx = d.target.x, ty = d.target.y;
    var dy = Math.abs(sy - ty);
    var cpY = dy * 0.6;
    var c1x = sx, c1y = sy - cpY;
    var c2x = tx, c2y = ty + cpY;
    return "M" + sx + "," + sy + " C" + c1x + "," + c1y + " " + c2x + "," + c2y + " " + tx + "," + ty;
  }

  function render() {
    var dims = layoutDims();
    var pos = getPositions(dims);

    // Build edges
    var allEdges = [];
    pos.prevNodes.forEach(function(p) {
      allEdges.push({ source: p, target: pos.current, weight: p.node.presetWeight, edgeType: "preset" });
    });
    pos.nextNodes.forEach(function(n) {
      var type = n.node.presetWeight >= 0.6 ? "preset" : "browse";
      allEdges.push({ source: pos.current, target: n, weight: n.node.presetWeight, edgeType: type });
    });

    var edgeGroup = g.selectAll("g.edge-group").data([0]);
    edgeGroup = edgeGroup.enter().append("g").attr("class", "edge-group").merge(edgeGroup);

    var edges = edgeGroup.selectAll("path.dag-edge").data(allEdges, function(d) {
      return d.source.node.id + "-" + d.target.node.id;
    });

    edges.exit().transition().duration(350).attr("opacity", 0).remove();

    var edgesEnter = edges.enter().append("path")
      .attr("class", function(d) { return "dag-edge " + (d.edgeType === "preset" ? "edge-preset" : "edge-browse"); })
      .attr("fill", "none")
      .attr("stroke", function(d) { return d.edgeType === "preset" ? CYAN : CYAN_DIM; })
      .attr("stroke-width", function(d) { return d.edgeType === "preset" ? 1.8 + d.weight * 1.5 : 1.2; })
      .attr("stroke-dasharray", function(d) { return d.edgeType === "preset" ? null : "5 4"; })
      .attr("marker-end", function(d) { return d.edgeType === "preset" ? "url(#arrow-cyan)" : "url(#arrow-cyan-dim)"; })
      .attr("opacity", 0);

    edgesEnter.merge(edges).transition().duration(600).ease(d3.easeCubicInOut)
      .attr("d", edgePath)
      .attr("opacity", function(d) { return d.edgeType === "preset" ? 0.8 : 0.5; });

    // Nodes
    var allNodes = pos.prevNodes.concat([pos.current]).concat(pos.nextNodes);
    var nodeGroup = g.selectAll("g.node-group").data([0]);
    nodeGroup = nodeGroup.enter().append("g").attr("class", "node-group").merge(nodeGroup);

    var nodes = nodeGroup.selectAll("g.dag-node").data(allNodes, function(d) { return d.node.id; });
    nodes.exit().transition().duration(350).attr("opacity", 0).remove();

    var nodesEnter = nodes.enter().append("g")
      .attr("class", function(d) { return "dag-node dag-node-" + d.node.type; })
      .attr("data-node-id", function(d) { return d.node.id; })
      .attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; })
      .attr("opacity", 0)
      .style("cursor", function(d) { return d.node.type === "next" ? "pointer" : "default"; });

    // Glow ring for current
    nodesEnter.filter(function(d) { return d.node.type === "current"; })
      .append("circle")
      .attr("r", CURRENT_NODE_R + 6).attr("fill", "none")
      .attr("stroke", CYAN_GLOW).attr("stroke-width", 2)
      .attr("filter", "url(#cyan-glow)").attr("class", "current-glow-ring");

    // Node circle
    nodesEnter.append("circle")
      .attr("r", function(d) { return d.node.type === "current" ? CURRENT_NODE_R : NODE_R; })
      .attr("fill", function(d) {
        if (d.node.type === "current") return "#0e2a35";
        if (d.node.type === "next") return CARD;
        return "#15202b";
      })
      .attr("stroke", function(d) {
        if (d.node.type === "current") return CYAN;
        if (d.node.type === "next") return CYAN_DIM;
        return BORD;
      })
      .attr("stroke-width", function(d) { return d.node.type === "current" ? 2.5 : 1.5; })
      .attr("class", "node-circle");

    // Inner dot for prev
    nodesEnter.filter(function(d) { return d.node.type === "prev"; })
      .append("circle").attr("r", 4).attr("fill", MUT).attr("class", "prev-dot");

    // Label
    nodesEnter.append("text")
      .attr("class", function(d) {
        if (d.node.type === "current") return "dag-current-label";
        if (d.node.type === "prev") return "dag-prev-label";
        return "dag-node-label";
      })
      .attr("y", function(d) { return (d.node.type === "current" ? CURRENT_NODE_R : NODE_R) + (d.node.type === "current" ? 18 : 16); })
      .text(function(d) { return d.node.label; });

    // Weight label for next
    nodesEnter.filter(function(d) { return d.node.type === "next" && d.node.presetWeight; })
      .append("text").attr("class", "dag-node-weight").attr("y", NODE_R + 30)
      .text(function(d) { return "权重 " + d.node.presetWeight.toFixed(1); });

    // Click: next nodes pulse glow
    nodesEnter.filter(function(d) { return d.node.type === "next"; })
      .on("click", function(event, d) {
        var el = d3.select(this);
        var circle = el.select(".node-circle");
        circle.transition().duration(150)
          .attr("stroke", CYAN).attr("stroke-width", 3).attr("fill", "#0a2a35")
          .transition().duration(600)
          .attr("stroke", CYAN_DIM).attr("stroke-width", 1.5).attr("fill", CARD);
        var ring = el.select(".pulse-ring");
        if (ring.empty()) {
          el.insert("circle", ".node-circle")
            .attr("r", NODE_R + 4).attr("fill", "none")
            .attr("stroke", CYAN).attr("stroke-width", 2)
            .attr("opacity", 0.8).attr("class", "pulse-ring")
            .transition().duration(800)
            .attr("r", NODE_R + 16).attr("opacity", 0)
            .on("end", function() { d3.select(this).remove(); });
        }
      });

    nodesEnter.transition().duration(500).delay(function(d, i) { return 100 + i * 80; })
      .attr("opacity", 1);

    nodes.transition().duration(600).ease(d3.easeCubicInOut)
      .attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });
  }

  function setupTabs() {
    var tabs = document.querySelectorAll("button[data-nav-key]");
    var routes = {
      "global-view": "canvas-global-view.html",
      "path-select": "canvas-path-select.html",
      "content-browse": "canvas-content-browse.html",
      "tree-manager": "canvas-tree-manager.html"
    };
    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        var key = this.getAttribute("data-nav-key");
        var target = routes[key];
        if (target && target !== "canvas-path-select.html") {
          window.location.href = target;
        }
      });
    });
  }

  function init() {
    lucide.createIcons();
    render();
    setupTabs();
    var rt;
    window.addEventListener("resize", function() {
      clearTimeout(rt);
      rt = setTimeout(render, 150);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
