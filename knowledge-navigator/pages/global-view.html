<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局全览 - 认知导航</title>
    <style id="theme-vars">
/* ===== 认知导航 — 温润聚焦 品牌样式 ===== */

/* ===== Primary Color Scale (Warm Amber) ===== */
:root {
  --color-primary-50: #FDF6EE;
  --color-primary-100: #FBE9D3;
  --color-primary-200: #F6D3A8;
  --color-primary-300: #F0B672;
  --color-primary-400: #E89D47;
  --color-primary-500: #D4893A;
  --color-primary-600: #BA6E2C;
  --color-primary-700: #9B5626;
  --color-primary-800: #7D4425;
  --color-primary-900: #683A22;
  --color-primary-950: #381C0F;
}

/* ===== Neutral Scale (Warm Gray) ===== */
:root {
  --color-neutral-50: #FAF7F4;
  --color-neutral-100: #F3EFEA;
  --color-neutral-200: #E8E2D8;
  --color-neutral-300: #D4CCC0;
  --color-neutral-400: #B0A696;
  --color-neutral-500: #8E8476;
  --color-neutral-600: #6E6559;
  --color-neutral-700: #595149;
  --color-neutral-800: #4A433D;
  --color-neutral-900: #3D3732;
  --color-neutral-950: #2D2420;
}

/* ===== State Colors ===== */
:root {
  --state-success: #5B9A5B;
  --state-success-light: #E8F3E8;
  --state-warning: #D4893A;
  --state-warning-light: #FDF6EE;
  --state-error: #C2544A;
  --state-error-light: #FAE8E6;
  --state-info: #5B7F9A;
  --state-info-light: #E8EEF3;
}

/* ===== Typography ===== */
:root {
  --font-sans: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
}

/* ===== Radius Scale ===== */
:root {
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
}

/* ===== Semantic Aliases ===== */
:root {
  --background: var(--color-neutral-50);
  --foreground: var(--color-neutral-950);
  --card: #FFFFFF;
  --card-foreground: var(--color-neutral-950);
  --popover: #FFFFFF;
  --popover-foreground: var(--color-neutral-950);
  --primary: var(--color-primary-500);
  --primary-foreground: #FFFFFF;
  --muted: var(--color-neutral-100);
  --muted-foreground: var(--color-neutral-500);
  --border: var(--color-neutral-200);
  --input: var(--color-neutral-100);
  --ring: var(--color-primary-400);
}

/* ===== Light Mode (Default) ===== */
.light {
  --background: var(--color-neutral-50);
  --foreground: var(--color-neutral-950);
  --card: #FFFFFF;
  --card-foreground: var(--color-neutral-950);
  --popover: #FFFFFF;
  --popover-foreground: var(--color-neutral-950);
  --primary: var(--color-primary-500);
  --primary-foreground: #FFFFFF;
  --muted: var(--color-neutral-100);
  --muted-foreground: var(--color-neutral-500);
  --border: var(--color-neutral-200);
  --input: var(--color-neutral-100);
  --ring: var(--color-primary-400);
}

/* ===== Dark Mode ===== */
.dark {
  --background: var(--color-neutral-950);
  --foreground: var(--color-neutral-50);
  --card: var(--color-neutral-900);
  --card-foreground: var(--color-neutral-50);
  --popover: var(--color-neutral-900);
  --popover-foreground: var(--color-neutral-50);
  --primary: var(--color-primary-400);
  --primary-foreground: var(--color-neutral-950);
  --muted: var(--color-neutral-800);
  --muted-foreground: var(--color-neutral-400);
  --border: var(--color-neutral-800);
  --input: var(--color-neutral-800);
  --ring: var(--color-primary-300);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
  }
  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">

      .text-foreground { color: var(--foreground); }
      .border-foreground { border-color: var(--foreground); }
      .ring-foreground { --tw-ring-color: var(--foreground); }
      .bg-card { background-color: var(--card); }
      .text-card { color: var(--card); }
      .border-card { border-color: var(--card); }
      .ring-card { --tw-ring-color: var(--card); }
      .bg-card-foreground { background-color: var(--card-foreground); }
      .text-card-foreground { color: var(--card-foreground); }
      .border-card-foreground { border-color: var(--card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--card-foreground); }
      .bg-popover { background-color: var(--popover); }
      .text-popover { color: var(--popover); }
      .border-popover { border-color: var(--popover); }
      .ring-popover { --tw-ring-color: var(--popover); }
      .bg-popover-foreground { background-color: var(--popover-foreground); }
      .text-popover-foreground { color: var(--popover-foreground); }
      .border-popover-foreground { border-color: var(--popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--popover-foreground); }
      .bg-primary { background-color: var(--primary); }
      .text-primary { color: var(--primary); }
      .border-primary { border-color: var(--primary); }
      .ring-primary { --tw-ring-color: var(--primary); }
      .bg-primary-foreground { background-color: var(--primary-foreground); }
      .text-primary-foreground { color: var(--primary-foreground); }
      .border-primary-foreground { border-color: var(--primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--primary-foreground); }
      .bg-muted { background-color: var(--muted); }
      .text-muted { color: var(--muted); }
      .border-muted { border-color: var(--muted); }
      .ring-muted { --tw-ring-color: var(--muted); }
      .bg-muted-foreground { background-color: var(--muted-foreground); }
      .text-muted-foreground { color: var(--muted-foreground); }
      .border-muted-foreground { border-color: var(--muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--muted-foreground); }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }
      .bg-input { background-color: var(--input); }
      .text-input { color: var(--input); }
      .border-input { border-color: var(--input); }
      .ring-input { --tw-ring-color: var(--input); }
      .bg-ring { background-color: var(--ring); }

      .border-ring { border-color: var(--ring); }
      .ring-ring { --tw-ring-color: var(--ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;

        -webkit-mask-size: contain;
        mask-size: contain;

        background-color: currentColor;
      }

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="flex flex-col min-h-screen bg-[var(--background)] text-[var(--foreground)] font-sans">
        <!-- ===== Simulated Mobile Status Bar ===== -->
        <div class="sticky top-0 z-40 flex items-center justify-between h-7 px-5 bg-[var(--background)] text-[11px] leading-none text-[var(--foreground)]">
            <span class="tabular-nums font-medium">9:41</span>
            <div class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="5" width="2" height="6" rx="0.5" fill="currentColor"/>
                    <rect x="4.5" y="3.5" width="2" height="9" rx="0.5" fill="currentColor"/>
                    <rect x="8" y="2" width="2" height="11" rx="0.5" fill="currentColor"/>
                    <rect x="11.5" y="1" width="2" height="13" rx="0.5" fill="currentColor"/>
                </svg>
                <svg class="w-5 h-3" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0.5" y="0.5" width="20" height="12" rx="2.5" stroke="currentColor" stroke-width="1"/>
                    <rect x="2" y="2" width="15" height="9" rx="1" fill="currentColor"/>
                    <rect x="19" y="3" width="1.5" height="3" rx="0.75" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- ===== Content Wrapper ===== -->
        <div id="page-content" class="flex-1 pb-[56px]">
            <!-- Header Area -->
            <div class="px-4 pt-6 pb-3">
                <h1 class="text-[28px] font-semibold leading-tight text-[var(--primary)]" style="text-wrap: balance; word-break: keep-all;">认知导航</h1>
                <p class="text-[14px] leading-relaxed text-[var(--muted-foreground)] mt-1.5">发现知识的脉络</p>
            </div>

            <!-- Search Bar -->
            <div class="px-4 pb-4">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i data-lucide="search" class="w-[18px] h-[18px] text-[var(--muted-foreground)]"></i>
                    </div>
                    <input
                        type="text"
                        placeholder="输入关键词，探索认知卡片..."
                        class="w-full h-11 pl-10 pr-4 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[15px] text-[var(--foreground)] placeholder-[var(--muted-foreground)] focus:outline-none focus:border-[var(--primary)] focus:ring-1 focus:ring-[var(--ring)] transition-colors duration-150"
                    />
                </div>
            </div>

            <!-- Cognitive Card Map -->
            <div class="px-4 pt-1 pb-2">
                <h2 class="text-[15px] font-semibold text-[var(--foreground)] mb-3">认知图谱</h2>
            </div>
            <div class="px-4">
                <div class="relative overflow-hidden py-1" style="background-image: radial-gradient(circle, var(--color-primary-200) 1.5px, transparent 1.5px); background-size: 44px 44px; background-position: 22px 22px;">
                    <div class="grid grid-cols-2 gap-3 relative z-[1]">
                        <!-- Card 1: 机器学习 (spans full width, has dom-id) -->
                        <button
                            data-dom-id="card-node-ml"
                            class="col-span-2 text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)] active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring)] focus-visible:ring-offset-1"
                        >
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-300);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">机器学习</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">从数据中学习模式与规律，驱动智能决策</p>
                        </button>

                        <!-- Card 2: 神经网络 -->
                        <div class="text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-400);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">神经网络</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">模拟生物神经系统的计算模型</p>
                        </div>

                        <!-- Card 3: 深度学习 -->
                        <div class="text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-500);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">深度学习</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">多层神经网络驱动的表示学习</p>
                        </div>

                        <!-- Card 4: 自然语言处理 -->
                        <div class="text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-600);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">自然语言处理</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">让机器理解、生成人类语言</p>
                        </div>

                        <!-- Card 5: 计算机视觉 -->
                        <div class="text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-400);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">计算机视觉</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">赋予机器"看见"和理解图像的能力</p>
                        </div>

                        <!-- Card 6: 知识图谱 -->
                        <div class="text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-300);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">知识图谱</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">结构化知识的关系语义网络</p>
                        </div>

                        <!-- Card 7: 强化学习 (spans full width) -->
                        <div class="col-span-2 text-left bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--color-primary-500);"></span>
                                <span class="text-[14px] font-semibold text-[var(--foreground)] truncate">强化学习</span>
                            </div>
                            <p class="text-[12px] text-[var(--muted-foreground)] leading-relaxed line-clamp-2">通过试错与环境交互，学习最优决策策略</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recently Visited -->
            <div class="px-4 pt-6 pb-2">
                <h2 class="text-[15px] font-semibold text-[var(--foreground)] mb-3">最近访问</h2>
                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                    <div class="shrink-0 w-[140px] bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(--color-primary-400);"></span>
                            <span class="text-[13px] font-medium text-[var(--foreground)] truncate">深度学习路径</span>
                        </div>
                        <p class="text-[11px] text-[var(--muted-foreground)]">2 小时前</p>
                    </div>
                    <div class="shrink-0 w-[140px] bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(--color-primary-300);"></span>
                            <span class="text-[13px] font-medium text-[var(--foreground)] truncate">NLP 入门路径</span>
                        </div>
                        <p class="text-[11px] text-[var(--muted-foreground)]">昨天</p>
                    </div>
                    <div class="shrink-0 w-[140px] bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(--color-primary-500);"></span>
                            <span class="text-[13px] font-medium text-[var(--foreground)] truncate">CV 视觉基础</span>
                        </div>
                        <p class="text-[11px] text-[var(--muted-foreground)]">3 天前</p>
                    </div>
                    <div class="shrink-0 w-[140px] bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(--color-primary-600);"></span>
                            <span class="text-[13px] font-medium text-[var(--foreground)] truncate">知识图谱入门</span>
                        </div>
                        <p class="text-[11px] text-[var(--muted-foreground)]">上周</p>
                    </div>
                    <div class="shrink-0 w-[140px] bg-[var(--card)] border border-[var(--border)] rounded-lg p-3 transition-all duration-150 hover:border-[var(--primary)]">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(--color-primary-400);"></span>
                            <span class="text-[13px] font-medium text-[var(--foreground)] truncate">强化学习实践</span>
                        </div>
                        <p class="text-[11px] text-[var(--muted-foreground)]">2 周前</p>
                    </div>
                </div>
            </div>

            <!-- Bottom spacer -->
            <div class="h-4"></div>
        </div>

        <!-- ===== Bottom Navigation Bar ===== -->
        <nav data-mobile-nav="global" class="sticky bottom-0 left-0 right-0 z-50 bg-[var(--card)] border-t border-[var(--border)]" style="height:56px">
            <div class="w-full max-w-md mx-auto grid grid-cols-4 h-full">
                <!-- 全览 — active -->
                <button
                    data-nav-key="global-view"
                    data-dom-id="tab-nav-global-view"
                    data-active="true"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--primary)] transition-colors duration-150"
                >
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">全览</span>
                </button>
                <!-- 导航 -->
                <button
                    data-nav-key="path-select"
                    data-dom-id="tab-nav-path-select"
                    data-active="false"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--muted-foreground)] transition-colors duration-150"
                >
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="6" cy="6" r="2"/>
                        <circle cx="18" cy="18" r="2"/>
                        <circle cx="12" cy="12" r="2"/>
                        <line x1="7.5" y1="5" x2="10.5" y2="11"/>
                        <line x1="13.5" y1="13" x2="16.5" y2="17"/>
                    </svg>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">导航</span>
                </button>
                <!-- 浏览 -->
                <button
                    data-nav-key="content-browse"
                    data-dom-id="tab-nav-content-browse"
                    data-active="false"
                    class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--muted-foreground)] transition-colors duration-150"
                >
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">浏览</span>
                </button>
